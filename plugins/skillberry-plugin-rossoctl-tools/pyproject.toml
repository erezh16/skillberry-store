[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillberry-plugin-rossoctl-tools"
version = "0.1.0"
description = "Skillberry Store plugin: use rossoctl tools in skills, through rossoctl's backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
]

[project.entry-points."skillberry_store.plugins"]
rossoctl-tools = "skillberry_plugin_rossoctl_tools.plugin:SkillberryPluginRossoctlTools"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
packages = ["skillberry_plugin_rossoctl_tools"]
package-dir = {"" = "src"}
