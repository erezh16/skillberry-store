# pytest.ini
[pytest]
pythonpath  = . src
# skillberry-common/tests holds the build system's own tests and does run; the
# packages under it are separately-installed distributions with their own
# pytest setup, so they are not part of this suite.
norecursedirs = skillberry-common/packages .extra-copy
addopts = --ignore=src/skillberry_store/contrib/examples/skills-sh-importer
markers =
    integration: marks tests as integration tests (require running service, deselect with '-m "not integration"')
